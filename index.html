<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brushify</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <center>
        <h1>Brushify</h1>
        <div id="editor" contenteditable="true"></div>
        <br>
       
        <button id="Download">Download</button>
        <br>
        <div id="parent">
            <div id="Backgroundcolor">
                <h2>Choose background color</h2>
                <button id="bgc"  onclick="bgcolor('red')" style="background-color: red;"></button>
                <button id="bgc" onclick="bgcolor('green')" style="background-color: green;"></button>
                <button id="bgc" onclick="bgcolor('blue')" style="background-color: blue;"></button>
                <button id="bgc" onclick="bgcolor('pink')" style="background-color: pink;"></button>
                <button id="bgc" onclick="bgcolor('skyblue')" style="background-color: skyblue;"></button>
            </div>
            <div id="Textcolor">
                <h1>TextColor</h1>
            <button id="bgc"  onclick="color('red')" style="background-color: red;"></button>
            <button id="bgc"  onclick="color('green')" style="background-color: green;"></button>
            <button id="bgc"  onclick="color('blue')" style="background-color: blue;"></button>
            <button id="bgc" onclick="color('pink')" style="background-color: pink;"></button>
            <button id="bgc" onclick="color('skyblue')" style="background-color: skyblue;"></button>
            </div>
            <br><br><br><br>
            <div id ="Fontsize">
            <h1>FontStyle</h1>
            <br>
            <button class="font" onclick="fontstyle('cursive')">Hello</button>
            <button class="font" onclick="fontstyle('sans-serif')">Hello</button>
            <button class="font" onclick="fontstyle('Edwardian script')">Hello</button>
            <button class="font" onclick="fontstyle('Edwardian Script ITC, Great Vibes, cursive')">Hello</button>
            <button class="font" onclick="fontstyle(`'Special Elite', monospace`)">Hello</button>
            </div>
        </div>
    </center>
    <script>
        function bgcolor(clr){
            document.getElementById('editor').style.backgroundColor = clr
        }
        function color(clr){
            document.getElementById('editor').style.color = clr
        }
        function fontstyle(fnt){
            document.getElementById('editor').style.fontFamily= fnt
        }
    </script>  
</body>
</html>
